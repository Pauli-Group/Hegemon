[package]
name = "protocol-shielded-pool"
version = "0.1.0"
edition = "2021"

[dependencies]
blake2 = { version = "0.10", default-features = false }
codec = { workspace = true, features = ["max-encoded-len"] }
hegemon-hash384 = { path = "../../crypto/hash384" }
protocol_versioning = { path = "../versioning", package = "protocol-versioning", default-features = false }
scale-info = { workspace = true }
transaction-core = { path = "../../circuits/transaction-core", default-features = false }

[features]
default = ["std"]
std = [
    "blake2/std",
    "codec/std",
    "protocol_versioning/std",
    "scale-info/std",
    "transaction-core/std",
]

[dev-dependencies]
hex = "0.4"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
