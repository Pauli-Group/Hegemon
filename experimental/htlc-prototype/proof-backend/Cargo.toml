[package]
name = "hegemon-isolated-htlc-smallwood"
version = "0.0.0"
edition = "2021"
publish = false
build = "build.rs"

[workspace]
resolver = "2"

# Match the source-included transaction crate's direct dependencies. No new
# backend is introduced and no production source/module visibility is edited.
[dependencies]
htlc-prototype = { package = "hegemon-isolated-htlc-prototype", path = ".." }
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
synthetic-crypto = { path = "../../../crypto" }
hegemon-hash384 = { path = "../../../crypto/hash384" }
hegemon-hash448 = { path = "../../../crypto/hash448" }
protocol-kernel = { path = "../../../protocol/kernel" }
hex = "0.4"
bincode = "1.3"
blake3 = "1.8"
sha2 = "=0.10.9"
sha3 = "0.10"
getrandom = "0.3"
hegemon-field = { path = "../../../circuits/hegemon-field" }
num-bigint = "0.4"
rayon = "1"
rand_core = "0.9"
protocol-versioning = { path = "../../../protocol/versioning" }
transaction-core = { path = "../../../circuits/transaction-core", features = ["serde"] }
postcard = { version = "1", default-features = false, features = ["alloc"] }

[build-dependencies]
sha2 = "=0.10.9"

[features]
default = []
formal-generator = []
hx512-refinement-evidence = []
hx512-working-proof-runner = ["hx512-refinement-evidence"]
rp05-dev-artifacts = []
slow-smallwood-e2e = []
stark-fast = ["transaction-core/stark-fast"]

[profile.dev]
debug = 0
incremental = false

[profile.release]
debug = 0
incremental = false
lto = false
