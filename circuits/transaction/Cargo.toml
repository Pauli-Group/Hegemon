[package]
name = "transaction-circuit"
version = "0.1.0"
edition = "2021"

[dependencies]
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
synthetic-crypto = { path = "../../crypto" }
hegemon-hash384 = { path = "../../crypto/hash384" }
hegemon-hash448 = { path = "../../crypto/hash448" }
protocol-kernel = { path = "../../protocol/kernel" }
hex = "0.4"
bincode = "1.3"
blake3 = "1.8"
sha2 = "0.10"
sha3 = "0.10"
getrandom = "0.3"
hegemon-field = { workspace = true }
num-bigint = "0.4"
rayon = "1"
rand_core = "0.9"
protocol-versioning = { path = "../../protocol/versioning" }
transaction-core = { path = "../transaction-core", features = ["serde"] }
postcard = { version = "1", default-features = false, features = ["alloc"] }

[dev-dependencies]
codec = { workspace = true }
proptest = "1"
protocol-shielded-pool = { path = "../../protocol/shielded-pool" }

[features]
default = []
formal-generator = []
hx512-refinement-evidence = []
hx512-working-proof-runner = ["hx512-refinement-evidence"]
slow-smallwood-e2e = []
stark-fast = ["transaction-core/stark-fast"]

[[bin]]
name = "gen_smallwood_production_constraint_lean"
path = "src/bin/gen_smallwood_production_constraint_lean.rs"
required-features = ["formal-generator"]

[lints]
workspace = true
