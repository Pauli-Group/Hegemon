[package]
name = "hegemon-standalone-shake256-prototype"
version = "0.0.0"
edition = "2021"
publish = false

# This crate is deliberately isolated from the production workspace.  It must
# not enter a consensus binary merely because the prototype compiles.
[workspace]
resolver = "2"

[dependencies]
sha3 = { version = "0.10.9", default-features = false }

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

