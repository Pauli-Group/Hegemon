[package]
name = "consensus-light-client"
version = "0.1.0"
edition = "2021"

[dependencies]
blake3 = { version = "1", default-features = false }
codec = { workspace = true }
hegemon-hash384 = { path = "../crypto/hash384", features = ["codec"] }
protocol-kernel = { path = "../protocol/kernel", default-features = false }
sha2 = { version = "0.10", default-features = false }

[dev-dependencies]
num-bigint = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["std"]
# Disposable legacy --dev activation at height 20; never enables pre-mainnet.
asert-rehearsal = []
# Exact funded Development fixture only; production activation remains unset.
combined-upgrade-rehearsal = []
std = [
    "blake3/std",
    "codec/std",
    "protocol-kernel/std",
    "sha2/std",
]

[lints]
workspace = true
