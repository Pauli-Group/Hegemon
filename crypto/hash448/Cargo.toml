[package]
name = "hegemon-hash448"
version = "0.1.0"
edition = "2021"
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Inactive V6 typed SHAKE256-448 consensus bindings for Hegemon"

[dependencies]
sha3 = { version = "0.10", default-features = false }
codec = { workspace = true, optional = true }
serde = { version = "1", default-features = false, optional = true }
scale-info = { workspace = true, optional = true }

[dev-dependencies]
bincode = "1.3"

[features]
default = []
codec = ["dep:codec"]
serde = ["dep:serde"]
type-info = ["dep:scale-info"]

[lints]
workspace = true
