name: v0.11.5 time rolling

on:
  pull_request:
    paths:
      - '.github/workflows/ntime-rolling.yml'
      - 'consensus-light-client/**'
      - 'consensus/**'
      - 'node/src/native/**'
      - 'protocol/versioning/**'
      - 'scripts/*ntime*'
      - 'scripts/check-core.sh'
      - 'scripts/test_check_qualified_formatting.py'
      - 'scripts/*bitcoin_asic*'
      - 'scripts/v011_join.py'
      - 'scripts/test_package_v011_release.py'
      - 'scripts/v0115_process_ownership.py'
      - 'scripts/test_v0115_process_ownership.py'
      - 'scripts/check_v0115_current_binary_proofs.py'
      - 'scripts/test_check_v0115_current_binary_proofs.py'
      - 'scripts/prepare_v0115_release.py'
      - 'scripts/test_prepare_v0115_release.py'
      - '.github/workflows/prepare-premainnet-release.yml'
      - 'config/ntime-rolling-v0115.json'
      - 'Cargo.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ntime-rolling-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_PROFILE_TEST_OPT_LEVEL: '2'
  CARGO_TARGET_DIR: target/v0115

jobs:
  source-and-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check source preparation and unchanged transaction-proof identity
        run: |
          python3 -I -B scripts/test_check_ntime_rolling_source.py
          python3 -I -B scripts/check_ntime_rolling_source.py
      - name: Verify v0.11.5 proof execution source and attribution
        shell: bash
        run: python3 -I -B scripts/test_check_v0115_current_binary_proofs.py
      - name: Exercise real Stratum TCP submissions
        run: python3 -I -B scripts/test_bitcoin_asic_stratum.py
      - name: Check release identity and launcher boundaries
        run: |
          python3 -B scripts/test_package_v011_release.py
          python3 -B scripts/test_release_launcher_boundaries.py
          python3 -B scripts/test_check_release_launcher_policy.py
      - run: git diff --exit-code -- Cargo.lock
  process-ownership-windows:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify native Windows process ownership before release build
        shell: bash
        run: python3 -I -B scripts/test_v0115_process_ownership.py --require-windows
      - name: Verify v0.11.5 proof execution source and attribution
        shell: bash
        run: python3 -I -B scripts/test_check_v0115_current_binary_proofs.py
  consensus:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select the source-pinned Rust toolchain
        run: rustup show
      - name: Check strict source formatting without release-artifact authority
        run: |
          python3 -I -B scripts/test_check_ntime_candidate_formatting.py
          python3 -I -B scripts/test_check_qualified_formatting.py
          python3 -I -B scripts/check_ntime_candidate_formatting.py --manifest workspace
          python3 -I -B scripts/check_ntime_candidate_formatting.py --manifest htlc
          python3 -I -B scripts/check_ntime_candidate_formatting.py --manifest proof-backend
      - name: Check historical and new consensus profiles
        run: |
          cargo test --locked -p consensus-light-client
          cargo test --locked -p consensus-light-client --features combined-upgrade-rehearsal
          cargo check --locked -p consensus-light-client --no-default-features
      - run: git diff --exit-code -- Cargo.lock
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select the source-pinned Rust toolchain
        run: rustup show
      - name: Check ordinary production-height time bounds
        run: cargo test --locked -p hegemon-node --no-default-features --lib native_timestamp_rolling
      - name: Check activation, solved work, sync, restart and reorg
        env:
          NTIME_TEST_FEATURES: development-candidate,combined-upgrade-rehearsal,asert-rehearsal,wallet/rpc-client,wallet/private-spend-dev-artifacts
        run: |
          cargo test --locked -p hegemon-node --no-default-features --features "$NTIME_TEST_FEATURES" --lib native::bitcoin_asic_tests::
          cargo test --locked -p hegemon-node --no-default-features --features "$NTIME_TEST_FEATURES" --lib native::timestamp_admission_tests::
          cargo test --locked -p hegemon-node --no-default-features --features "$NTIME_TEST_FEATURES" --lib native::asert_tests::
          cargo test --locked -p hegemon-node --no-default-features --features "$NTIME_TEST_FEATURES" --lib treasury_cadence
      - run: git diff --exit-code -- Cargo.lock
