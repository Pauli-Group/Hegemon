name: Windows testnet launcher fixtures

on:
  push:
    branches: [codex/testnet-0-10-3-wallet-launcher]
    paths:
      - '.github/workflows/windows-testnet-launcher.yml'
      - 'testnet-release/testnet-start.cmd'
      - 'scripts/test_windows_testnet_launcher.py'
      - 'config/release-launcher-policy.json'

permissions:
  contents: read

jobs:
  windows-launcher:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Preserve committed source line endings
        shell: bash
        run: git config --global core.autocrlf false

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: "1.91.1"

      - name: Verify reviewed release launcher policy
        shell: bash
        run: python3 -B scripts/check_release_launcher_policy.py

      - name: Verify Windows testnet launcher behavior
        shell: bash
        run: python3 -B scripts/test_windows_testnet_launcher.py
