name: RP05 proof package
on:
  pull_request:
    paths: &paths
      - 'formal/rp05/**'
      - 'formal/crypto/**'
      - 'formal/lean/**'
      - 'scripts/rp05_*.py'
      - 'scripts/test_rp05_*.py'
      - 'scripts/lean_axiom_audit.lean'
      - 'docs/crypto/RP05*'
      - 'docs/crypto/rp05*'
      - 'config/transaction-proof-successor-selection.json'
      - 'config/poseidon2-width16-v1.json'
      - 'circuits/transaction-core/src/poseidon2_width16.rs'
      - 'scripts/check_poseidon2_width16_parameters.py'
      - 'scripts/transaction_proof_successor_authorized_registry.py'
      - '.github/workflows/rp05-proof.yml'
  push:
    branches: [main]
    paths: *paths
  schedule:
    - cron: '17 4 * * 0'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: rp05-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      proof: ${{ steps.guard.outputs.proof }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Source/import/manifest and public claim guard (no Lean required)
        id: guard
        env:
          RP05_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 -I -B scripts/rp05_ci.py source
      - name: RP05 tooling regressions
        run: |
          python3 -I -B scripts/test_rp05_ci.py
          python3 -I -B scripts/test_rp05_proof_package.py
          python3 -I -B scripts/rp05_primitive_assumptions.py check
          python3 -I -B scripts/test_rp05_primitive_assumptions.py
      # Existing release/authorization jobs remain independently required.
  proof:
    needs: source
    if: needs.source.outputs.proof == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Install pinned Lean manager
        env:
          ELAN_INIT_SHA256: a620ff1641616222c8d37c54845492004bb84d6877cdbc944dd65c1aa685bf53
        run: |
          curl --proto '=https' --tlsv1.2 --fail --location --show-error https://elan.lean-lang.org/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          printf '%s  %s\n' "$ELAN_INIT_SHA256" "$RUNNER_TEMP/elan-init.sh" | sha256sum -c -
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Prepare locked external library cache only
        timeout-minutes: 8
        working-directory: formal/crypto
        run: |
          lake exe cache get
          git diff --exit-code -- lean-toolchain lake-manifest.json lakefile.toml
      - name: Fingerprint compiler, libraries, policy and ordered source graph
        id: inputs
        run: python3 -I -B scripts/rp05_ci.py prepare
      # Never restore actions/cache here: PR-scoped caches can shadow main.
      # Select artifacts ONLY from completed successful main runs of this workflow.
      - name: Locate trusted default-branch project objects
        id: trusted
        if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        uses: actions/github-script@v7
        env:
          RP05_ARTIFACT_PREFIX: rp05-project-${{ steps.inputs.outputs.prefix }}
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner, repo: context.repo.repo,
              workflow_id: 'rp05-proof.yml', branch: 'main', status: 'success', per_page: 100
            });
            for (const run of runs.data.workflow_runs) {
              if (run.head_branch !== 'main' || !['push','schedule','workflow_dispatch'].includes(run.event)) continue;
              const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner, repo: context.repo.repo, run_id: run.id
              });
              const artifact = artifacts.data.artifacts.find(a =>
                !a.expired && a.name.startsWith(process.env.RP05_ARTIFACT_PREFIX));
              if (artifact) {
                core.setOutput('run', String(run.id));
                core.setOutput('artifact', String(artifact.id));
                break;
              }
            }
      - uses: actions/download-artifact@v4
        if: steps.trusted.outputs.artifact != ''
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.trusted.outputs.run }}
          artifact-ids: ${{ steps.trusted.outputs.artifact }}
          merge-multiple: true
          path: ${{ runner.temp }}/rp05-ci/cache
      - name: Bounded incremental compile and public/supplemental actual-body audits
        if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' && steps.trusted.outputs.artifact != ''
        run: python3 -I -B scripts/rp05_ci.py verify --seconds 600
      - name: Cold project compilation, body audits, serial kernel replay
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || steps.trusted.outputs.artifact == ''
        run: python3 -I -B scripts/rp05_ci.py verify --cold --seconds 4800
      - uses: actions/upload-artifact@v4
        if: success() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: rp05-project-${{ steps.inputs.outputs.prefix }}${{ github.run_id }}
          path: ${{ runner.temp }}/rp05-ci/cache
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
      - name: Publish exact lane result
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/rp05-ci/result.json"; then
            cat "$RUNNER_TEMP/rp05-ci/result.json"
          else
            echo 'RP05 proof lane did not complete; no verification result or production authority.' >> "$GITHUB_STEP_SUMMARY"
          fi
