name: Emergency Linux node build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emergency-linux-node:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: e2fcbe4df99025d3b955d5053ebc1f21436db6f2
          persist-credentials: false
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libclang-dev
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: "1.91.1"
          components: rust-src
      - name: Build exact fixed Linux node
        env:
          CARGO_INCREMENTAL: "0"
          CARGO_NET_RETRY: "10"
          CARGO_HTTP_TIMEOUT: "600"
        run: |
          test "$(git rev-parse HEAD)" = e2fcbe4df99025d3b955d5053ebc1f21436db6f2
          cargo build --locked --release -p hegemon-node --bin hegemon-node --no-default-features
      - name: Bind exact source and executable bytes
        run: |
          python3 -B - <<'PY'
          import hashlib, json, pathlib, subprocess, sys
          sys.path.insert(0, 'scripts')
          import release_artifact_manifest as m
          root = pathlib.Path.cwd()
          git = lambda *a: subprocess.check_output(['git', *a], text=True).strip()
          identity = dict(source_head=git('rev-parse', 'HEAD'), source_index_tree=git('rev-parse', 'HEAD^{tree}'), source_tree_sha256=m.source_tree_sha256(root), cargo_lock_sha256=hashlib.sha256((root/'Cargo.lock').read_bytes()).hexdigest())
          expected = dict(source_head='e2fcbe4df99025d3b955d5053ebc1f21436db6f2', source_index_tree='d01d1838af535ab84dc4e1f414dafdc6c0b3c0b4', source_tree_sha256='33a33e89d19c17e37b0567066252452e04382a2c399e1885baedeb48c8acdcd7', cargo_lock_sha256='1c243bf3858f4ee22fa4441c7a2ee6d49b16d264147b0f3a2de845e760821719')
          assert identity == expected
          artifact = m.inspect_artifact(root, 'hegemon-node', 'hegemon-node', root/'target/release/hegemon-node', 'target/release/hegemon-node', 'x86_64-unknown-linux-gnu')
          record = dict(schema='hegemon.emergency-linux-node-build.v1', source=identity, target_triple='x86_64-unknown-linux-gnu', binary=artifact, full_ci_qualified=False)
          (root/'target/release/emergency-node-manifest.json').write_text(json.dumps(record, indent=2)+'\n')
          PY
          mkdir -p target/emergency-release
          cp target/release/hegemon-node target/emergency-release/hegemon-node-linux-x86_64
          cp target/release/emergency-node-manifest.json target/emergency-release/
          cd target/emergency-release
          sha256sum hegemon-node-linux-x86_64 > hegemon-node-linux-x86_64.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: emergency-linux-node-e2fcbe4
          path: target/emergency-release/
