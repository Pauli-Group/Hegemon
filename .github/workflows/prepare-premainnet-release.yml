# Exact-source three-run assembly; no build or publication.
name: Composed release assembly

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  assemble-prepared-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: e2fcbe4df99025d3b955d5053ebc1f21436db6f2
          persist-credentials: false
      - name: Download all prepared binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: linux-binary
          path: artifacts/linux-binary
          github-token: ${{ github.token }}
          repository: Pauli-Group/Hegemon
          run-id: 42099224311
      - name: Download original Intel artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: macos-intel-binary
          path: artifacts/macos-intel-binary
          github-token: ${{ github.token }}
          repository: Pauli-Group/Hegemon
          run-id: 42099224311
      - name: Download original Windows artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: windows-binary
          path: artifacts/windows-binary
          github-token: ${{ github.token }}
          repository: Pauli-Group/Hegemon
          run-id: 42099224311
      - name: Download replacement full ARM artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: macos-arm-binary
          path: artifacts/macos-arm-binary
          github-token: ${{ github.token }}
          repository: Pauli-Group/Hegemon
          run-id: 42116889827
      - name: Verify and assemble manifest-bound release assets
        run: /usr/bin/python3 -I -B scripts/release_artifact_manifest.py assemble --bundle-manifest artifacts/linux-binary/hegemon-release-assets-linux-x86_64.json --bundle-manifest artifacts/macos-intel-binary/hegemon-release-assets-macos-x86_64.json --bundle-manifest artifacts/macos-arm-binary/hegemon-release-assets-macos-arm64.json --bundle-manifest artifacts/windows-binary/hegemon-release-assets-windows-x86_64.json --output-dir release-assets
      - name: Retain prepared files for operator review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: premainnet-release-assets
          path: release-assets/
          if-no-files-found: error
          retention-days: 14
