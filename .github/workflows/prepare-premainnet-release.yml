# Generated by scripts/prepare_premainnet_release.py --write.
# Keep release.yml and its reviewed publication policy unchanged.
# PR review defers exhaustive Lean/vector checks; non-PR runs retain full gates.
name: Prepare pre-mainnet release

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: prepare-premainnet-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_TIMEOUT: "600"

permissions:
  contents: read

jobs:
  preparation-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify preparation scope and release build gates
        run: /usr/bin/python3 -I -B scripts/prepare_premainnet_release.py --check --combined-candidate
      - name: Preparation workflow regression controls
        run: /usr/bin/python3 -I -B scripts/prepare_premainnet_release_test.py
      - name: v0.11 launcher boundary regressions without live peers
        run: /usr/bin/python3 -I -B scripts/test_premainnet_launcher.py
      - name: Bounded predecessor archive rejection controls
        run: /usr/bin/python3 -I -B scripts/test_materialize_v011_predecessor.py
      - name: ASIC adapter solution-retention regressions
        run: python3 -I -B scripts/test_bitcoin_asic_stratum.py
      - name: v0.11.3 successor policy rejection controls
        run: /usr/bin/python3 -I -B scripts/test_check_combined_upgrade_candidate.py
      - name: Combined candidate mutation and routing controls
        run: python3 -I -B scripts/test_check_combined_upgrade_candidate.py
      - name: Actual combined qualification producer rejection controls
        run: python3 -I -B scripts/test_qualify_combined_upgrade.py
      - name: v0.11.3 preparation routing regression controls
        run: /usr/bin/python3 -I -B scripts/test_prepare_v0113_release.py
      - name: v0.11.3 formatting policy rejection controls
        run: /usr/bin/python3 -I -B scripts/test_check_combined_upgrade_candidate.py

  transaction-proof-authorization:
    needs: preparation-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install retained-artifact verifier build dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libclang-dev clang lld

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: "1.91.1"

      - name: Restore authenticated unchanged v0.11 predecessor
        run: python3 -I -B scripts/materialize_v011_predecessor.py --destination target/v011-predecessor --reserve-bytes 4294967296

      - name: Current successor scope rejection controls
        run: python3 -I -B scripts/test_check_combined_upgrade_candidate.py

      - name: Current successor final-consumer rejection controls
        run: python3 -I -B scripts/tests/v011_current_successor/test_successor_consumer.py --consumer scripts/check_release_crypto_profile.py --receipt-fixture scripts/tests/v011_current_successor/synthetic-final-receipt.json --artifact-manifest scripts/tests/v011_current_successor/synthetic-artifact-manifest.json --registry scripts/tests/v011_current_successor/synthetic-historical-registry.json

      - name: Current security-audit scope rejection controls
        run: python3 -I -B scripts/tests/v011_current_successor/test_security_audit_scope.py --audit-script scripts/security-audit.sh

      - name: Current artifact-gate identity rejection controls
        run: python3 -I -B scripts/tests/v011_current_successor/test_artifact_gate_identity.py --checker scripts/check_v011_release_successor.py --artifact-helper scripts/release_artifact_manifest.py --launcher-helper scripts/check_release_launcher_policy.py

      - name: Current-binary proof-runner rejection controls
        run: python3 -I -B scripts/test_check_v011_current_binary_proofs.py

      - name: Transaction-proof successor authorization release gate
        run: /usr/bin/python3 -I -B scripts/check_combined_upgrade_candidate.py --prepare --predecessor-root target/v011-predecessor

      - name: Release workflow policy regression
        run: /usr/bin/python3 -I -B scripts/test_check_ci_release_gate_policy.py

      - name: Historical SmallWood authorization regression
        run: /usr/bin/python3 -I -B scripts/test_check_smallwood_production_authorization.py

      - name: Transaction-proof successor authorization regression
        run: /usr/bin/python3 -I -B scripts/test_check_transaction_proof_successor_authorization.py

  security-gates:
    runs-on: ubuntu-latest
    needs: transaction-proof-authorization
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libclang-dev clang lld

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: "1.91.1"
          components: rust-src, rustfmt

      - name: v0.11.3 successor formatting gates
        run: |
          set -euo pipefail
          python3 -I -B scripts/check_combined_candidate_formatting.py --manifest workspace
          python3 -I -B scripts/check_combined_candidate_formatting.py --manifest htlc
          python3 -I -B scripts/check_combined_candidate_formatting.py --manifest proof-backend

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Install Lean toolchain manager
        if: github.event_name != 'pull_request'
        env:
          ELAN_INIT_SHA256: a620ff1641616222c8d37c54845492004bb84d6877cdbc944dd65c1aa685bf53
        run: |
          ELAN_INIT="$RUNNER_TEMP/elan-init.sh"
          curl --proto '=https' --tlsv1.2 --fail --location --show-error https://elan.lean-lang.org/elan-init.sh -o "$ELAN_INIT"
          printf '%s  %s\n' "$ELAN_INIT_SHA256" "$ELAN_INIT" | sha256sum -c -
          sh "$ELAN_INIT" -y --default-toolchain none

      - name: Dependency audit waiver gate
        run: ./scripts/dependency-audit-gate.sh

      - name: Network transport progress regressions
        run: |
          set -euo pipefail
          ./scripts/run_exact_cargo_lib_test.sh network p2p::tests::split_connection_drains_simultaneous_large_frames_and_preserves_nonce_state
          ./scripts/run_exact_cargo_lib_test.sh network p2p::tests::cancelled_partial_split_write_poisoned_session_cannot_reuse_nonce
          ./scripts/run_exact_cargo_lib_test.sh network peer_manager::tests::rejected_duplicate_does_not_refresh_stale_active_session
          ./scripts/run_exact_cargo_lib_test.sh network peer_manager::tests::closed_session_can_be_replaced_without_old_disconnect_removing_new_session
          ./scripts/run_exact_cargo_lib_test.sh network service::tests::bounded_peer_deliveries_preserve_fifo_without_blocking_other_peers
          ./scripts/run_exact_cargo_lib_test.sh network service::tests::bounded_peer_delivery_cap_and_failed_session_release_all_retained_messages
          ./scripts/run_exact_cargo_lib_test.sh network service::tests::full_protocol_handler_does_not_suspend_other_protocols
          ./scripts/run_exact_cargo_lib_test.sh network service::tests::peer_driver_receives_while_its_large_frame_write_is_backpressured

      - name: Known-loser announcement admission regressions
        run: |
          set -euo pipefail
          ./scripts/run_exact_cargo_lib_test.sh hegemon-node native::tests::mining_recovery_qualification_tests::duplicate_stored_loser_compact_hints_never_close_gate_for_retained_asic_solution --no-default-features
          ./scripts/run_exact_cargo_lib_test.sh hegemon-node native::tests::mining_recovery_qualification_tests::unknown_equal_height_and_higher_hints_keep_retained_asic_solution_gated_without_write --no-default-features
          ./scripts/run_exact_cargo_lib_test.sh hegemon-node native::tests::sync_liveness_tests::stored_loser_classification_preserves_a_newer_unknown_target_and_backfill --no-default-features

      - name: Native sync and import liveness regressions
        run: |
          set -euo pipefail
          ./scripts/run_exact_cargo_lib_test.sh hegemon-node native::node_impl::announcement_snapshot_precheck_tests::stored_announcement_returns_without_waiting_for_canonical_state --no-default-features
          ./scripts/run_exact_cargo_lib_test.sh hegemon-node native::node_impl::announcement_snapshot_precheck_tests::stored_announcement_wrong_chain_rejects_before_lookup_or_snapshot --no-default-features
          ./scripts/run_exact_cargo_lib_test.sh hegemon-node native::node_impl::announcement_snapshot_precheck_tests::stored_announcement_poisoned_storage_rejects_before_lookup_or_snapshot --no-default-features
          ./scripts/run_exact_cargo_lib_test.sh hegemon-node native::node_impl::announcement_snapshot_precheck_tests::stored_announcement_malformed_metadata_rejects_without_snapshot --no-default-features
          ./scripts/run_exact_cargo_lib_test.sh hegemon-node native::node_impl::announcement_snapshot_precheck_tests::stored_announcement_key_alias_rejects_without_snapshot --no-default-features
          ./scripts/run_exact_cargo_lib_test.sh hegemon-node native::node_impl::announcement_snapshot_precheck_tests::stored_announcement_work_hash_alias_rejects_without_snapshot --no-default-features
          ./scripts/run_exact_cargo_lib_test.sh hegemon-node native::node_impl::announcement_snapshot_precheck_tests::concurrent_stored_announcement_insertion_keeps_post_snapshot_guard --no-default-features
          ./scripts/run_exact_cargo_lib_test.sh hegemon-node native::node_impl::announcement_snapshot_precheck_tests::unknown_and_competing_announcements_retain_validation_and_durable_fork_choice --no-default-features
          ./scripts/run_exact_cargo_lib_test.sh hegemon-node native::node_impl::announcement_snapshot_precheck_tests::unknown_announcement_invalid_state_root_is_not_admitted --no-default-features
          ./scripts/run_exact_cargo_lib_test.sh hegemon-node native::node_impl::announcement_snapshot_precheck_tests::admitted_sync_request_token_is_the_exact_reserved_request --no-default-features
          ./scripts/run_exact_cargo_lib_test.sh hegemon-node native::node_impl::announcement_snapshot_precheck_tests::local_capacity_wait_preserves_exact_request_and_import_ownership --no-default-features
          ./scripts/run_exact_cargo_lib_test.sh hegemon-node native::node_impl::announcement_snapshot_precheck_tests::local_capacity_wait_retries_after_existing_pacing_window_with_exact_context --no-default-features
          ./scripts/run_exact_cargo_lib_test.sh hegemon-node native::node_impl::announcement_snapshot_precheck_tests::local_capacity_wait_retains_normal_freshness_boundary_and_target_expiry --no-default-features
          ./scripts/run_exact_cargo_lib_test.sh hegemon-node native::node_impl::announcement_snapshot_precheck_tests::stale_sync_send_token_cannot_mutate_a_replaced_request --no-default-features
          ./scripts/run_exact_cargo_lib_test.sh hegemon-node native::service::sync_control_backpressure_tests::sync_control_saturated_real_sender_blocks_old_send_but_not_body_control --no-default-features
          ./scripts/run_exact_cargo_lib_test.sh hegemon-node native::service::sync_control_backpressure_tests::sync_control_full_target_scheduler_preserves_request_context_and_target --no-default-features
          ./scripts/run_exact_cargo_lib_test.sh hegemon-node native::service::sync_control_backpressure_tests::sync_control_full_direct_request_preserves_target_without_peer_penalty --no-default-features
          ./scripts/run_exact_cargo_lib_test.sh hegemon-node native::service::sync_control_backpressure_tests::sync_control_closed_direct_request_preserves_target_without_peer_penalty --no-default-features
          ./scripts/run_exact_cargo_lib_test.sh hegemon-node native::service::sync_control_backpressure_tests::sync_control_full_channel_drains_and_readmits_the_same_recovery_request --no-default-features
          ./scripts/run_exact_cargo_lib_test.sh hegemon-node native::service::sync_control_backpressure_tests::sync_control_held_announce_encoder_keeps_runtime_ticks_and_completions_responsive --no-default-features
          ./scripts/run_exact_cargo_lib_test.sh hegemon-node native::service::sync_control_backpressure_tests::sync_control_prepared_announce_preserves_eligibility_and_rechecks_tip_without_blocking --no-default-features
          ./scripts/run_exact_cargo_lib_test.sh hegemon-node native::service::sync_control_backpressure_tests::sync_control_failed_announce_preparation_releases_slot_for_retry --no-default-features
          ./scripts/run_exact_cargo_lib_test.sh hegemon-node native::service::sync_body_backpressure::tests::body_local_full_preserves_range_origin_retry_age_suffix_and_other_reservations --no-default-features
          ./scripts/run_exact_cargo_lib_test.sh hegemon-node native::service::sync_body_backpressure::tests::body_local_full_stale_callback_cannot_remove_newer_locator_with_same_hash --no-default-features
          ./scripts/run_exact_cargo_lib_test.sh hegemon-node native::service::sync_body_backpressure::tests::body_local_full_cannot_abort_progress_or_another_reservation_epoch --no-default-features
          ./scripts/run_exact_cargo_lib_test.sh hegemon-node native::service::sync_body_backpressure::tests::body_local_full_eventually_readmits_after_global_item_and_byte_capacity_frees --no-default-features
          ./scripts/run_exact_cargo_lib_test.sh hegemon-node native::service::sync_body_backpressure::tests::body_local_full_moves_existing_slot_at_full_peer_and_global_queue_limits --no-default-features
          ./scripts/run_exact_cargo_lib_test.sh hegemon-node native::service::sync_body_backpressure::tests::body_local_full_repeated_deferral_cannot_extend_absolute_lifetime --no-default-features
          ./scripts/run_exact_cargo_lib_test.sh hegemon-node native::service::sync_body_backpressure::tests::body_local_full_rollback_leaves_normal_idle_retry_and_expiry_unchanged --no-default-features

      - name: v0.11.3 public HTTP admission and catalog regressions
        run: |
          set -euo pipefail
          ./scripts/run_exact_cargo_lib_test.sh hegemon-node native::public_rpc_http_tests::public_http_catalog_is_safe_plus_submit_and_privileged_calls_do_not_mutate --no-default-features
          ./scripts/run_exact_cargo_lib_test.sh hegemon-node native::public_rpc_http_tests::public_http_existing_policies_and_auto_default_keep_their_surface --no-default-features
          ./scripts/run_exact_cargo_lib_test.sh hegemon-node native::public_rpc_http_tests::public_http_batch_charges_each_submission_and_forwarded_headers_do_not_reset_it --no-default-features
          ./scripts/run_exact_cargo_lib_test.sh hegemon-node native::public_rpc_http_tests::public_http_full_client_table_denies_new_client_without_eviction --no-default-features
          ./scripts/run_exact_cargo_lib_test.sh hegemon-node native::public_rpc_http_tests::public_http_rejects_malformed_inactive_wrong_binding_and_other_action_families --no-default-features
          ./scripts/run_exact_cargo_lib_test.sh hegemon-node native::public_rpc_http_tests::public_http_cors_is_closed_by_default_and_explicit_origin_is_exact --no-default-features
          ./scripts/run_exact_cargo_lib_test.sh hegemon-node native::public_rpc_http_tests::public_http_disconnected_safe_read_workers_keep_bounded_reservations_until_completion --no-default-features
          ./scripts/run_exact_cargo_lib_test.sh hegemon-node native::public_rpc_http_tests::public_http_disconnected_submit_keeps_public_permit_and_local_capacity_available --no-default-features
          ./scripts/run_exact_cargo_lib_test.sh hegemon-node native::public_rpc_http_tests::public_http_parser_and_batch_failures_release_worker_capacity --no-default-features
          ./scripts/run_exact_cargo_lib_test.sh hegemon-node native::public_rpc_http_tests::public_http_safe_reads_are_rate_charged_per_batch_item --no-default-features
          ./scripts/run_exact_cargo_lib_test.sh hegemon-node native::public_rpc_http_tests::public_http_rejects_oversized_id_without_echoing_it --no-default-features
          ./scripts/run_exact_cargo_lib_test.sh hegemon-node native::public_rpc_http_tests::public_http_rejects_noncanonical_request_envelopes_before_action_dispatch --no-default-features
          ./scripts/run_exact_cargo_lib_test.sh hegemon-node native::public_rpc_http_tests::public_http_disconnect_during_body_collection_releases_unstarted_request --no-default-features
          ./scripts/run_exact_cargo_lib_test.sh hegemon-node native::public_rpc_http_tests::public_http_malformed_bodies_cannot_bypass_preparse_rate_accounting --no-default-features
          ./scripts/run_exact_cargo_lib_test.sh hegemon-node native::public_rpc_http_tests::public_http_single_requests_are_charged_exactly_once --no-default-features
          ./scripts/run_exact_cargo_lib_test.sh hegemon-node native::public_rpc_formal_tests::public_rpc_formal_catalog_matches_registered_available_dispatch --no-default-features
          ./scripts/run_exact_cargo_lib_test.sh hegemon-node native::public_rpc_formal_tests::public_rpc_formal_effective_surface_is_safe_plus_submit --no-default-features

      - name: Formal-core checker controls for PR review
        if: github.event_name == 'pull_request'
        run: bash scripts/check_formal_core.sh checker

      - name: Formal-core policy checks for PR review
        if: github.event_name == 'pull_request'
        run: bash scripts/check_formal_core.sh policy

      - name: Formal-core release gate
        if: github.event_name != 'pull_request'
        run: bash scripts/check_formal_core.sh

      - name: Formal-crypto isolation release gate
        run: bash scripts/check_formal_crypto.sh --isolation-only

      - name: Complete formal cryptography release gate
        if: github.event_name != 'pull_request'
        env:
          HEGEMON_FORMAL_CRYPTO_MIN_FREE_GIB: '8'
        run: bash scripts/check_formal_crypto.sh full

      - name: Production parser/verifier refinement regression
        run: ./scripts/run_exact_cargo_lib_test.sh transaction-circuit smallwood_engine::tests::lean_generated_smallwood_proof_wire_vectors_match_production_parser

      - name: SMZ8 parser/verifier refinement regression
        run: ./scripts/run_exact_cargo_lib_test.sh transaction-circuit smallwood_engine::tests::lean_generated_smz8_proof_wire_vectors_match_production_parser
      - name: SMZ9 parser/verifier refinement regression
        run: ./scripts/run_exact_cargo_lib_test.sh transaction-circuit smallwood_engine::tests::lean_generated_smz9_proof_wire_vectors_match_production_parser
      - name: V8 PendingAction private-codec conformance regression
        run: ./scripts/run_exact_cargo_lib_test.sh hegemon-node native::tests::protocol_v8_artifact_codec_matches_private_pending_action_v3_exactly

      - name: SmallWood V5 strict security gate regression
        run: python3 .agent/hardening/smallwood-pqc-zk/test_strict_profile.py

      - name: SmallWood V5 candidate manifest gate
        env:
          HEGEMON_SMALLWOOD_V5_TRUST_ROOT_SHA256: ${{ vars.HEGEMON_SMALLWOOD_V5_TRUST_ROOT_SHA256 }}
        run: python3 scripts/check_smallwood_v5_candidate_gate.py

      - name: Fetch pinned historical native backend source
        run: git fetch --no-tags --depth=1 origin 4810888722e8c9a2440e31b139f8cb10b060acee

      - name: Historical native backend review package verification
        run: ./scripts/verify_native_backend_review_package.sh --historical-release

      - name: Native backend release posture gate
        run: ./scripts/check_native_backend_release_posture.sh --package audits/native-backend-128b/native-backend-128b-review-package.tar.gz

  app-no-ssh-e2e:
    runs-on: ubuntu-latest
    needs: security-gates
    env:
      HEGEMON_E2E_MINE_THREADS: "4"
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install app dependencies
        run: npm ci --prefix hegemon-app

      - name: App UI guard gate
        run: npm --prefix hegemon-app run check:ui-guards

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libclang-dev

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: "1.91.1"
          components: rust-src

      - name: App no-SSH release workflow
        run: ./scripts/check-app-no-ssh-e2e.sh --review-only
        # Seed/relay and fresh-wallet sync only; fundedTransactionsExercised:false.
        # Native HGN lifecycle and final-binary proof/security gates remain required.

  build-linux:
    runs-on: ubuntu-latest
    needs:
      - security-gates
      - app-no-ssh-e2e
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: "1.91.1"
          components: rust-src

      - name: Build attested release artifacts
        run: ./scripts/build_release_artifacts.sh

      - name: Verify release artifact manifest
        run: python3 scripts/release_artifact_manifest.py verify --manifest target/release/hegemon-release-artifacts.json --expect hegemon-node:hegemon-node:target/release/hegemon-node --expect wallet:wallet:target/release/wallet --expect walletd:walletd:target/release/walletd --expect wallet:private-spend:target/release/private-spend
      - name: Restore authenticated unchanged v0.11 predecessor
        run: python3 -I -B scripts/materialize_v011_predecessor.py --destination target/v011-predecessor --reserve-bytes 4294967296

      - name: Install candidate qualification Lean toolchain
        shell: bash
        env:
          ELAN_INIT_SHA256: a620ff1641616222c8d37c54845492004bb84d6877cdbc944dd65c1aa685bf53
        run: |
          set -euo pipefail
          ELAN_INIT="$RUNNER_TEMP/combined-elan-init.sh"
          curl --proto '=https' --tlsv1.2 --fail --location --show-error https://elan.lean-lang.org/elan-init.sh -o "$ELAN_INIT"
          python3 -I -B -c 'import hashlib,pathlib,sys; assert hashlib.sha256(pathlib.Path(sys.argv[1]).read_bytes()).hexdigest() == sys.argv[2]' "$ELAN_INIT" "$ELAN_INIT_SHA256"
          sh "$ELAN_INIT" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat formal/asert/lean-toolchain)"
          (cd formal/asert && "$HOME/.elan/bin/lean" --version)

      - name: Validate final common proof authorization and affected lifecycle
        run: python3 -I -B scripts/check_combined_upgrade_candidate.py --require-authorized --predecessor-root target/v011-predecessor --artifact-manifest target/release/hegemon-release-artifacts.json --require-final-artifact

      - name: Release PQ binary audit
        run: ./scripts/security-audit.sh --require-binary --binary-manifest target/release/hegemon-release-artifacts.json --node-bin target/release/hegemon-node --binary target/release/wallet --binary target/release/walletd --binary target/release/private-spend

      - name: Package manifest-bound release assets
        run: python3 scripts/release_artifact_manifest.py package --manifest target/release/hegemon-release-artifacts.json --expect hegemon-node:hegemon-node:target/release/hegemon-node --expect wallet:wallet:target/release/wallet --expect walletd:walletd:target/release/walletd --expect wallet:private-spend:target/release/private-spend --asset hegemon-node:hegemon-node:hegemon-node-linux-x86_64 --asset wallet:wallet:wallet-linux-x86_64 --asset walletd:walletd:walletd-linux-x86_64 --asset wallet:private-spend:private-spend-linux-x86_64 --output-dir release --asset-manifest-name hegemon-release-assets-linux-x86_64.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-binary
          path: release/

  build-macos-intel:
    runs-on: macos-15-intel
    needs:
      - security-gates
      - app-no-ssh-e2e
