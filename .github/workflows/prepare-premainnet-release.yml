name: Emergency Linux node build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emergency-linux-node:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: e2fcbe4df99025d3b955d5053ebc1f21436db6f2
          persist-credentials: false
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libclang-dev
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: "1.91.1"
          components: rust-src
      - name: Build exact fixed Linux node
        env:
          CARGO_INCREMENTAL: "0"
          CARGO_NET_RETRY: "10"
          CARGO_HTTP_TIMEOUT: "600"
        run: |
          test "$(git rev-parse HEAD)" = e2fcbe4df99025d3b955d5053ebc1f21436db6f2
          cargo build --locked --release -p hegemon-node --bin hegemon-node --no-default-features
      - name: Bind exact source and executable bytes
        run: |
          python3 -B scripts/release_artifact_manifest.py create --output target/release/emergency-node-manifest.json --target-triple x86_64-unknown-linux-gnu --artifact hegemon-node:hegemon-node:target/release/hegemon-node
          python3 -B scripts/release_artifact_manifest.py verify --manifest target/release/emergency-node-manifest.json --expect hegemon-node:hegemon-node:target/release/hegemon-node
          mkdir -p target/emergency-release
          cp target/release/hegemon-node target/emergency-release/hegemon-node-linux-x86_64
          cp target/release/emergency-node-manifest.json target/emergency-release/
          cd target/emergency-release
          sha256sum hegemon-node-linux-x86_64 > hegemon-node-linux-x86_64.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: emergency-linux-node-e2fcbe4
          path: target/emergency-release/
