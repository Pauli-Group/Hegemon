# Draft only. Coordinator owns workflow commit, dispatch and evidence acceptance.
# Build checkout is fixed independently of the workflow carrier commit.
name: Full macOS ARM replacement

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: full-arm-e2fcbe4-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_TIMEOUT: "600"

jobs:
  build-macos-arm:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: e2fcbe4df99025d3b955d5053ebc1f21436db6f2
          persist-credentials: false

      - name: Verify exact frozen source and native ARM host
        run: |
          test "$(uname -m)" = arm64
          python3 -B - <<'PY_SOURCE'
          import hashlib, pathlib, subprocess, sys
          sys.path.insert(0, 'scripts')
          import release_artifact_manifest as m
          root = pathlib.Path.cwd()
          git = lambda *a: subprocess.check_output(['git', *a], text=True).strip()
          actual = dict(source_head=git('rev-parse', 'HEAD'), source_index_tree=git('rev-parse', 'HEAD^{tree}'), source_tree_sha256=m.source_tree_sha256(root), cargo_lock_sha256=hashlib.sha256((root/'Cargo.lock').read_bytes()).hexdigest())
          expected = dict(source_head='e2fcbe4df99025d3b955d5053ebc1f21436db6f2', source_index_tree='d01d1838af535ab84dc4e1f414dafdc6c0b3c0b4', source_tree_sha256='33a33e89d19c17e37b0567066252452e04382a2c399e1885baedeb48c8acdcd7', cargo_lock_sha256='1c243bf3858f4ee22fa4441c7a2ee6d49b16d264147b0f3a2de845e760821719')
          assert actual == expected
          PY_SOURCE

      - name: Install dependencies
        run: |
          brew install protobuf

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: "1.91.1"
          components: rust-src

      - name: Build attested release artifacts
        run: ./scripts/build_release_artifacts.sh

      - name: Verify release artifact manifest
        run: python3 scripts/release_artifact_manifest.py verify --manifest target/release/hegemon-release-artifacts.json --expect hegemon-node:hegemon-node:target/release/hegemon-node --expect wallet:wallet:target/release/wallet --expect walletd:walletd:target/release/walletd --expect wallet:private-spend:target/release/private-spend
      - name: Restore authenticated unchanged v0.11 predecessor
        run: python3 -I -B scripts/materialize_v011_predecessor.py --destination target/v011-predecessor --reserve-bytes 4294967296

      - name: Validate final common proof authorization and affected lifecycle
        run: python3 -I -B scripts/check_v011_release_successor.py --require-authorized --predecessor-root target/v011-predecessor --artifact-manifest target/release/hegemon-release-artifacts.json --require-final-artifact

      - name: Release PQ binary audit
        run: ./scripts/security-audit.sh --require-binary --binary-manifest target/release/hegemon-release-artifacts.json --node-bin target/release/hegemon-node --binary target/release/wallet --binary target/release/walletd --binary target/release/private-spend

      - name: Package manifest-bound release assets
        run: python3 scripts/release_artifact_manifest.py package --manifest target/release/hegemon-release-artifacts.json --expect hegemon-node:hegemon-node:target/release/hegemon-node --expect wallet:wallet:target/release/wallet --expect walletd:walletd:target/release/walletd --expect wallet:private-spend:target/release/private-spend --asset hegemon-node:hegemon-node:hegemon-node-macos-arm64 --asset wallet:wallet:wallet-macos-arm64 --asset walletd:walletd:walletd-macos-arm64 --asset wallet:private-spend:private-spend-macos-arm64 --output-dir release --asset-manifest-name hegemon-release-assets-macos-arm64.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macos-arm-binary
          path: release/

