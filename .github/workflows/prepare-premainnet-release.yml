  build-windows:
    runs-on: windows-latest
    needs:
      - security-gates
      - app-no-ssh-e2e
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install LLVM
        run: choco install llvm -y

      - name: Install Protobuf
        run: choco install protoc -y

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: "1.91.1"
          components: rust-src

      - name: Verify Windows raw-byte launcher hashing
        shell: bash
        run: |
          python3 -B scripts/test_check_release_launcher_policy.py ReleaseLauncherPolicyTests.test_bounded_reader_preserves_crlf_and_ctrl_z_bytes ReleaseLauncherPolicyTests.test_crlf_helper_requires_its_raw_digest_not_normalized_lf

      - name: Build attested release artifacts
        shell: bash
        run: ./scripts/build_release_artifacts.sh

      - name: Verify release artifact manifest
        shell: bash
        run: python3 scripts/release_artifact_manifest.py verify --manifest target/release/hegemon-release-artifacts.json --expect hegemon-node:hegemon-node:target/release/hegemon-node.exe --expect wallet:wallet:target/release/wallet.exe --expect walletd:walletd:target/release/walletd.exe --expect wallet:private-spend:target/release/private-spend.exe
      - name: Restore authenticated unchanged v0.11 predecessor
        shell: bash
        run: python3 -I -B scripts/materialize_v011_predecessor.py --destination target/v011-predecessor --reserve-bytes 4294967296

      - name: Install candidate qualification Lean toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = 'v4.2.2'
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/leanprover/elan/releases/tags/$version"
          if ($release.tag_name -ne $version) { throw 'elan release version differs' }
          $assets = @($release.assets | Where-Object { $_.name -eq 'elan-x86_64-pc-windows-msvc.zip' })
          if ($assets.Count -ne 1 -or $assets[0].digest -notmatch '^sha256:[0-9a-f]{64}$') { throw 'exact elan asset SHA256 unavailable' }
          $stage = Join-Path $env:RUNNER_TEMP 'combined-elan'
          New-Item -ItemType Directory -Force $stage | Out-Null
          $archive = Join-Path $stage 'elan.zip'
          Invoke-WebRequest -Uri $assets[0].browser_download_url -OutFile $archive
          $expected = $assets[0].digest.Substring(7)
          if ((Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant() -ne $expected) { throw 'elan asset SHA256 differs' }
          Expand-Archive -Path $archive -DestinationPath $stage -Force
          & (Join-Path $stage 'elan-init.exe') -y --default-toolchain none
          if ($LASTEXITCODE -ne 0) { throw 'elan installation failed' }
          $bin = Join-Path $env:USERPROFILE '.elan/bin'
          Add-Content -Path $env:GITHUB_PATH -Value $bin
          $toolchain = (Get-Content -Raw 'formal/asert/lean-toolchain').Trim()
          & (Join-Path $bin 'elan.exe') toolchain install $toolchain
          if ($LASTEXITCODE -ne 0) { throw 'pinned Lean installation failed' }
          & (Join-Path $bin 'elan.exe') run $toolchain lean --version
          if ($LASTEXITCODE -ne 0) { throw 'pinned Lean execution failed' }

      - name: Validate final common proof authorization and affected lifecycle
        shell: bash
        run: python3 -I -B scripts/check_combined_upgrade_candidate.py --require-authorized --predecessor-root target/v011-predecessor --artifact-manifest target/release/hegemon-release-artifacts.json --require-final-artifact

      - name: Release PQ binary audit
        shell: bash
        run: ./scripts/security-audit.sh --require-binary --binary-manifest target/release/hegemon-release-artifacts.json --node-bin target/release/hegemon-node.exe --binary target/release/wallet.exe --binary target/release/walletd.exe --binary target/release/private-spend.exe

      - name: Package manifest-bound release assets
        shell: bash
        run: python3 scripts/release_artifact_manifest.py package --manifest target/release/hegemon-release-artifacts.json --expect hegemon-node:hegemon-node:target/release/hegemon-node.exe --expect wallet:wallet:target/release/wallet.exe --expect walletd:walletd:target/release/walletd.exe --expect wallet:private-spend:target/release/private-spend.exe --asset hegemon-node:hegemon-node:hegemon-node-windows-x86_64.exe --asset wallet:wallet:wallet-windows-x86_64.exe --asset walletd:walletd:walletd-windows-x86_64.exe --asset wallet:private-spend:private-spend-windows-x86_64.exe --output-dir release --asset-manifest-name hegemon-release-assets-windows-x86_64.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-binary
          path: release/

  assemble-prepared-release:
    needs: [build-linux, build-macos-intel, build-macos-arm, build-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Download all prepared binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: artifacts
      - name: Verify and assemble manifest-bound release assets
        run: /usr/bin/python3 -I -B scripts/release_artifact_manifest.py assemble --bundle-manifest artifacts/linux-binary/hegemon-release-assets-linux-x86_64.json --bundle-manifest artifacts/macos-intel-binary/hegemon-release-assets-macos-x86_64.json --bundle-manifest artifacts/macos-arm-binary/hegemon-release-assets-macos-arm64.json --bundle-manifest artifacts/windows-binary/hegemon-release-assets-windows-x86_64.json --output-dir release-assets
      - name: Retain prepared files for operator review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: premainnet-release-assets
          path: release-assets/
          if-no-files-found: error
          retention-days: 14
