name: Emergency macOS and Windows node builds

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emergency-macos-arm-node:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: e2fcbe4df99025d3b955d5053ebc1f21436db6f2
          persist-credentials: false
      - name: Install dependencies
        run: brew install protobuf
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: "1.91.1"
          components: rust-src
      - name: Build exact fixed node
        shell: bash
        env:
          CARGO_INCREMENTAL: "0"
          CARGO_NET_RETRY: "10"
          CARGO_HTTP_TIMEOUT: "600"
        run: |
          test "$(git rev-parse HEAD)" = e2fcbe4df99025d3b955d5053ebc1f21436db6f2
          cargo build --locked --release -p hegemon-node --bin hegemon-node --no-default-features
      - name: Bind exact source and executable bytes
        shell: bash
        run: |
          python3 -B - <<'PY'
          import hashlib, json, pathlib, shutil, subprocess, sys
          sys.path.insert(0, 'scripts')
          import release_artifact_manifest as m
          root = pathlib.Path.cwd()
          git = lambda *a: subprocess.check_output(['git', *a], text=True).strip()
          identity = dict(source_head=git('rev-parse', 'HEAD'), source_index_tree=git('rev-parse', 'HEAD^{tree}'), source_tree_sha256=m.source_tree_sha256(root), cargo_lock_sha256=hashlib.sha256((root/'Cargo.lock').read_bytes()).hexdigest())
          expected = {'source_head': 'e2fcbe4df99025d3b955d5053ebc1f21436db6f2', 'source_index_tree': 'd01d1838af535ab84dc4e1f414dafdc6c0b3c0b4', 'source_tree_sha256': '33a33e89d19c17e37b0567066252452e04382a2c399e1885baedeb48c8acdcd7', 'cargo_lock_sha256': '1c243bf3858f4ee22fa4441c7a2ee6d49b16d264147b0f3a2de845e760821719'}
          assert identity == expected
          artifact = m.inspect_artifact(root, 'hegemon-node', 'hegemon-node', root/'target/release/hegemon-node', 'target/release/hegemon-node', 'aarch64-apple-darwin')
          record = dict(schema='hegemon.emergency-node-build.v1', source=identity, target_triple='aarch64-apple-darwin', binary=artifact, full_ci_qualified=False)
          destination = root/'target/emergency-release'
          destination.mkdir(parents=True, exist_ok=False)
          shutil.copyfile(root/'target/release/hegemon-node', destination/'hegemon-node-macos-arm64')
          (destination/'emergency-node-manifest.json').write_text(json.dumps(record, indent=2)+'\n', encoding='utf-8')
          (destination/'hegemon-node-macos-arm64.sha256').write_text(hashlib.sha256((destination/'hegemon-node-macos-arm64').read_bytes()).hexdigest()+'  hegemon-node-macos-arm64\n', encoding='utf-8')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: emergency-macos-arm-node-e2fcbe4
          path: target/emergency-release/

  emergency-macos-intel-node:
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: e2fcbe4df99025d3b955d5053ebc1f21436db6f2
          persist-credentials: false
      - name: Install dependencies
        run: brew install protobuf
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: "1.91.1"
          components: rust-src
          targets: x86_64-apple-darwin
      - name: Build exact fixed node
        shell: bash
        env:
          CARGO_INCREMENTAL: "0"
          CARGO_NET_RETRY: "10"
          CARGO_HTTP_TIMEOUT: "600"
        run: |
          test "$(git rev-parse HEAD)" = e2fcbe4df99025d3b955d5053ebc1f21436db6f2
          cargo build --locked --release -p hegemon-node --bin hegemon-node --no-default-features --target x86_64-apple-darwin
      - name: Bind exact source and executable bytes
        shell: bash
        run: |
          python3 -B - <<'PY'
          import hashlib, json, pathlib, shutil, subprocess, sys
          sys.path.insert(0, 'scripts')
          import release_artifact_manifest as m
          root = pathlib.Path.cwd()
          git = lambda *a: subprocess.check_output(['git', *a], text=True).strip()
          identity = dict(source_head=git('rev-parse', 'HEAD'), source_index_tree=git('rev-parse', 'HEAD^{tree}'), source_tree_sha256=m.source_tree_sha256(root), cargo_lock_sha256=hashlib.sha256((root/'Cargo.lock').read_bytes()).hexdigest())
          expected = {'source_head': 'e2fcbe4df99025d3b955d5053ebc1f21436db6f2', 'source_index_tree': 'd01d1838af535ab84dc4e1f414dafdc6c0b3c0b4', 'source_tree_sha256': '33a33e89d19c17e37b0567066252452e04382a2c399e1885baedeb48c8acdcd7', 'cargo_lock_sha256': '1c243bf3858f4ee22fa4441c7a2ee6d49b16d264147b0f3a2de845e760821719'}
          assert identity == expected
          artifact = m.inspect_artifact(root, 'hegemon-node', 'hegemon-node', root/'target/x86_64-apple-darwin/release/hegemon-node', 'target/x86_64-apple-darwin/release/hegemon-node', 'x86_64-apple-darwin')
          record = dict(schema='hegemon.emergency-node-build.v1', source=identity, target_triple='x86_64-apple-darwin', binary=artifact, full_ci_qualified=False)
          destination = root/'target/emergency-release'
          destination.mkdir(parents=True, exist_ok=False)
          shutil.copyfile(root/'target/x86_64-apple-darwin/release/hegemon-node', destination/'hegemon-node-macos-x86_64')
          (destination/'emergency-node-manifest.json').write_text(json.dumps(record, indent=2)+'\n', encoding='utf-8')
          (destination/'hegemon-node-macos-x86_64.sha256').write_text(hashlib.sha256((destination/'hegemon-node-macos-x86_64').read_bytes()).hexdigest()+'  hegemon-node-macos-x86_64\n', encoding='utf-8')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: emergency-macos-intel-node-e2fcbe4
          path: target/emergency-release/

  emergency-windows-node:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Preserve exact LF source bytes before checkout
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: e2fcbe4df99025d3b955d5053ebc1f21436db6f2
          persist-credentials: false
      - name: Install LLVM
        run: choco install llvm -y
      - name: Install Protobuf
        run: choco install protoc -y
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: "1.91.1"
          components: rust-src
      - name: Build exact fixed node
        shell: bash
        env:
          CARGO_INCREMENTAL: "0"
          CARGO_NET_RETRY: "10"
          CARGO_HTTP_TIMEOUT: "600"
        run: |
          test "$(git rev-parse HEAD)" = e2fcbe4df99025d3b955d5053ebc1f21436db6f2
          cargo build --locked --release -p hegemon-node --bin hegemon-node --no-default-features
      - name: Bind exact source and executable bytes
        shell: bash
        run: |
          python3 -B - <<'PY'
          import hashlib, json, pathlib, shutil, subprocess, sys
          sys.path.insert(0, 'scripts')
          import release_artifact_manifest as m
          root = pathlib.Path.cwd()
          git = lambda *a: subprocess.check_output(['git', *a], text=True).strip()
          identity = dict(source_head=git('rev-parse', 'HEAD'), source_index_tree=git('rev-parse', 'HEAD^{tree}'), source_tree_sha256=m.source_tree_sha256(root), cargo_lock_sha256=hashlib.sha256((root/'Cargo.lock').read_bytes()).hexdigest())
          expected = {'source_head': 'e2fcbe4df99025d3b955d5053ebc1f21436db6f2', 'source_index_tree': 'd01d1838af535ab84dc4e1f414dafdc6c0b3c0b4', 'source_tree_sha256': '33a33e89d19c17e37b0567066252452e04382a2c399e1885baedeb48c8acdcd7', 'cargo_lock_sha256': '1c243bf3858f4ee22fa4441c7a2ee6d49b16d264147b0f3a2de845e760821719'}
          assert identity == expected
          artifact = m.inspect_artifact(root, 'hegemon-node', 'hegemon-node', root/'target/release/hegemon-node.exe', 'target/release/hegemon-node.exe', 'x86_64-pc-windows-msvc')
          record = dict(schema='hegemon.emergency-node-build.v1', source=identity, target_triple='x86_64-pc-windows-msvc', binary=artifact, full_ci_qualified=False)
          destination = root/'target/emergency-release'
          destination.mkdir(parents=True, exist_ok=False)
          shutil.copyfile(root/'target/release/hegemon-node.exe', destination/'hegemon-node-windows-x86_64.exe')
          (destination/'emergency-node-manifest.json').write_text(json.dumps(record, indent=2)+'\n', encoding='utf-8')
          (destination/'hegemon-node-windows-x86_64.exe.sha256').write_text(hashlib.sha256((destination/'hegemon-node-windows-x86_64.exe').read_bytes()).hexdigest()+'  hegemon-node-windows-x86_64.exe\n', encoding='utf-8')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: emergency-windows-node-e2fcbe4
          path: target/emergency-release/
