# Generated by scripts/prepare_premainnet_release.py --write.
# Keep release.yml and its reviewed publication policy unchanged.
# PR review defers exhaustive Lean/vector checks; non-PR runs retain full gates.
name: Prepare pre-mainnet release

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: prepare-premainnet-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_TIMEOUT: "600"

permissions:
  contents: read

jobs:
  preparation-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Verify preparation scope and release build gates
        run: /usr/bin/python3 -I -B scripts/prepare_premainnet_release.py --check
      - name: Preparation workflow regression controls
        run: /usr/bin/python3 -I -B scripts/prepare_premainnet_release_test.py
      - name: v0.11 launcher boundary regressions without live peers
        run: /usr/bin/python3 -I -B scripts/test_premainnet_launcher.py
      - name: Bounded predecessor archive rejection controls
        run: /usr/bin/python3 -I -B scripts/test_materialize_v011_predecessor.py

  transaction-proof-authorization:
    needs: preparation-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Install retained-artifact verifier build dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libclang-dev clang lld

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: "1.91.1"

      - name: Restore authenticated unchanged v0.11 predecessor
        run: python3 -I -B scripts/materialize_v011_predecessor.py --destination target/v011-predecessor --reserve-bytes 4294967296

      - name: Current successor scope rejection controls
        run: python3 -I -B scripts/tests/v011_current_successor/test_successor_scope.py --checker scripts/check_v011_release_successor.py

      - name: Current successor final-consumer rejection controls
        run: python3 -I -B scripts/tests/v011_current_successor/test_successor_consumer.py --consumer scripts/check_release_crypto_profile.py --receipt-fixture scripts/tests/v011_current_successor/synthetic-final-receipt.json --artifact-manifest scripts/tests/v011_current_successor/synthetic-artifact-manifest.json --registry scripts/tests/v011_current_successor/synthetic-historical-registry.json

      - name: Current security-audit scope rejection controls
        run: python3 -I -B scripts/tests/v011_current_successor/test_security_audit_scope.py --audit-script scripts/security-audit.sh

      - name: Current artifact-gate identity rejection controls
        run: python3 -I -B scripts/tests/v011_current_successor/test_artifact_gate_identity.py --checker scripts/check_v011_release_successor.py --artifact-helper scripts/release_artifact_manifest.py --launcher-helper scripts/check_release_launcher_policy.py

      - name: Current-binary proof-runner rejection controls
        run: python3 -I -B scripts/test_check_v011_current_binary_proofs.py

      - name: Transaction-proof successor authorization release gate
        run: /usr/bin/python3 -I -B scripts/check_v011_release_successor.py --require-authorized --predecessor-root target/v011-predecessor

      - name: Release workflow policy regression
        run: /usr/bin/python3 -I -B scripts/test_check_ci_release_gate_policy.py

      - name: Historical SmallWood authorization regression
        run: /usr/bin/python3 -I -B scripts/test_check_smallwood_production_authorization.py

      - name: Transaction-proof successor authorization regression
        run: /usr/bin/python3 -I -B scripts/test_check_transaction_proof_successor_authorization.py

  security-gates:
    runs-on: ubuntu-latest
    needs: transaction-proof-authorization
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libclang-dev clang lld

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: "1.91.1"
          components: rust-src

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Install Lean toolchain manager
        if: github.event_name != 'pull_request'
        env:
          ELAN_INIT_SHA256: a620ff1641616222c8d37c54845492004bb84d6877cdbc944dd65c1aa685bf53
        run: |
          ELAN_INIT="$RUNNER_TEMP/elan-init.sh"
          curl --proto '=https' --tlsv1.2 --fail --location --show-error https://elan.lean-lang.org/elan-init.sh -o "$ELAN_INIT"
          printf '%s  %s\n' "$ELAN_INIT_SHA256" "$ELAN_INIT" | sha256sum -c -
          sh "$ELAN_INIT" -y --default-toolchain none

      - name: Dependency audit waiver gate
        run: ./scripts/dependency-audit-gate.sh

      - name: Formal-core checker controls for PR review
        if: github.event_name == 'pull_request'
        run: bash scripts/check_formal_core.sh checker

      - name: Formal-core policy checks for PR review
        if: github.event_name == 'pull_request'
        run: bash scripts/check_formal_core.sh policy

      - name: Formal-core release gate
        if: github.event_name != 'pull_request'
        run: bash scripts/check_formal_core.sh

      - name: Formal-crypto isolation release gate
        run: bash scripts/check_formal_crypto.sh --isolation-only

      - name: Complete formal cryptography release gate
        if: github.event_name != 'pull_request'
        env:
          HEGEMON_FORMAL_CRYPTO_MIN_FREE_GIB: '8'
        run: bash scripts/check_formal_crypto.sh full

      - name: Production parser/verifier refinement regression
        run: ./scripts/run_exact_cargo_lib_test.sh transaction-circuit smallwood_engine::tests::lean_generated_smallwood_proof_wire_vectors_match_production_parser

      - name: SMZ8 parser/verifier refinement regression
        run: ./scripts/run_exact_cargo_lib_test.sh transaction-circuit smallwood_engine::tests::lean_generated_smz8_proof_wire_vectors_match_production_parser
      - name: SMZ9 parser/verifier refinement regression
        run: ./scripts/run_exact_cargo_lib_test.sh transaction-circuit smallwood_engine::tests::lean_generated_smz9_proof_wire_vectors_match_production_parser
      - name: V8 PendingAction private-codec conformance regression
        run: ./scripts/run_exact_cargo_lib_test.sh hegemon-node native::tests::protocol_v8_artifact_codec_matches_private_pending_action_v3_exactly

      - name: SmallWood V5 strict security gate regression
        run: python3 .agent/hardening/smallwood-pqc-zk/test_strict_profile.py

      - name: SmallWood V5 candidate manifest gate
        env:
          HEGEMON_SMALLWOOD_V5_TRUST_ROOT_SHA256: ${{ vars.HEGEMON_SMALLWOOD_V5_TRUST_ROOT_SHA256 }}
        run: python3 scripts/check_smallwood_v5_candidate_gate.py

      - name: Fetch pinned historical native backend source
        run: git fetch --no-tags --depth=1 origin 4810888722e8c9a2440e31b139f8cb10b060acee

      - name: Historical native backend review package verification
        run: ./scripts/verify_native_backend_review_package.sh --historical-release

      - name: Native backend release posture gate
        run: ./scripts/check_native_backend_release_posture.sh --package audits/native-backend-128b/native-backend-128b-review-package.tar.gz

  app-no-ssh-e2e:
    runs-on: ubuntu-latest
    needs: security-gates
    env:
      HEGEMON_E2E_MINE_THREADS: "4"
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Install app dependencies
        run: npm ci --prefix hegemon-app

      - name: App UI guard gate
        run: npm --prefix hegemon-app run check:ui-guards

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libclang-dev

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: "1.91.1"
          components: rust-src

      - name: App no-SSH release workflow
        run: ./scripts/check-app-no-ssh-e2e.sh --review-only
        # Seed/relay and fresh-wallet sync only; fundedTransactionsExercised:false.
        # Native HGN lifecycle and final-binary proof/security gates remain required.

  build-linux:
    runs-on: ubuntu-latest
    needs:
      - security-gates
      - app-no-ssh-e2e
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: "1.91.1"
          components: rust-src

      - name: Build attested release artifacts
        run: ./scripts/build_release_artifacts.sh

      - name: Verify release artifact manifest
        run: python3 scripts/release_artifact_manifest.py verify --manifest target/release/hegemon-release-artifacts.json --expect hegemon-node:hegemon-node:target/release/hegemon-node --expect wallet:wallet:target/release/wallet --expect walletd:walletd:target/release/walletd --expect wallet:private-spend:target/release/private-spend
      - name: Restore authenticated unchanged v0.11 predecessor
        run: python3 -I -B scripts/materialize_v011_predecessor.py --destination target/v011-predecessor --reserve-bytes 4294967296

      - name: Validate final common proof authorization and affected lifecycle
        run: python3 -I -B scripts/check_v011_release_successor.py --require-authorized --predecessor-root target/v011-predecessor --artifact-manifest target/release/hegemon-release-artifacts.json --require-final-artifact

      - name: Release PQ binary audit
        run: ./scripts/security-audit.sh --require-binary --binary-manifest target/release/hegemon-release-artifacts.json --node-bin target/release/hegemon-node --binary target/release/wallet --binary target/release/walletd --binary target/release/private-spend

      - name: Package manifest-bound release assets
        run: python3 scripts/release_artifact_manifest.py package --manifest target/release/hegemon-release-artifacts.json --expect hegemon-node:hegemon-node:target/release/hegemon-node --expect wallet:wallet:target/release/wallet --expect walletd:walletd:target/release/walletd --expect wallet:private-spend:target/release/private-spend --asset hegemon-node:hegemon-node:hegemon-node-linux-x86_64 --asset wallet:wallet:wallet-linux-x86_64 --asset walletd:walletd:walletd-linux-x86_64 --asset wallet:private-spend:private-spend-linux-x86_64 --output-dir release --asset-manifest-name hegemon-release-assets-linux-x86_64.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-binary
          path: release/

  build-macos-intel:
    runs-on: macos-15-intel
    needs:
      - security-gates
      - app-no-ssh-e2e
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          brew install protobuf

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: "1.91.1"
          targets: x86_64-apple-darwin
          components: rust-src

      - name: Build attested release artifacts
        run: ./scripts/build_release_artifacts.sh --target x86_64-apple-darwin

      - name: Verify release artifact manifest
        run: python3 scripts/release_artifact_manifest.py verify --manifest target/x86_64-apple-darwin/release/hegemon-release-artifacts.json --expect hegemon-node:hegemon-node:target/x86_64-apple-darwin/release/hegemon-node --expect wallet:wallet:target/x86_64-apple-darwin/release/wallet --expect walletd:walletd:target/x86_64-apple-darwin/release/walletd --expect wallet:private-spend:target/x86_64-apple-darwin/release/private-spend
      - name: Restore authenticated unchanged v0.11 predecessor
        run: python3 -I -B scripts/materialize_v011_predecessor.py --destination target/v011-predecessor --reserve-bytes 4294967296

      - name: Validate final common proof authorization and affected lifecycle
        run: python3 -I -B scripts/check_v011_release_successor.py --require-authorized --predecessor-root target/v011-predecessor --artifact-manifest target/x86_64-apple-darwin/release/hegemon-release-artifacts.json --require-final-artifact

      - name: Release PQ binary audit
        run: ./scripts/security-audit.sh --require-binary --binary-manifest target/x86_64-apple-darwin/release/hegemon-release-artifacts.json --node-bin target/x86_64-apple-darwin/release/hegemon-node --binary target/x86_64-apple-darwin/release/wallet --binary target/x86_64-apple-darwin/release/walletd --binary target/x86_64-apple-darwin/release/private-spend

      - name: Package manifest-bound release assets
        run: python3 scripts/release_artifact_manifest.py package --manifest target/x86_64-apple-darwin/release/hegemon-release-artifacts.json --expect hegemon-node:hegemon-node:target/x86_64-apple-darwin/release/hegemon-node --expect wallet:wallet:target/x86_64-apple-darwin/release/wallet --expect walletd:walletd:target/x86_64-apple-darwin/release/walletd --expect wallet:private-spend:target/x86_64-apple-darwin/release/private-spend --asset hegemon-node:hegemon-node:hegemon-node-macos-x86_64 --asset wallet:wallet:wallet-macos-x86_64 --asset walletd:walletd:walletd-macos-x86_64 --asset wallet:private-spend:private-spend-macos-x86_64 --output-dir release --asset-manifest-name hegemon-release-assets-macos-x86_64.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macos-intel-binary
          path: release/

  build-macos-arm:
    runs-on: macos-14
    needs:
      - security-gates
      - app-no-ssh-e2e
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          brew install protobuf

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: "1.91.1"
          components: rust-src

      - name: Build attested release artifacts
        run: ./scripts/build_release_artifacts.sh

      - name: Verify release artifact manifest
        run: python3 scripts/release_artifact_manifest.py verify --manifest target/release/hegemon-release-artifacts.json --expect hegemon-node:hegemon-node:target/release/hegemon-node --expect wallet:wallet:target/release/wallet --expect walletd:walletd:target/release/walletd --expect wallet:private-spend:target/release/private-spend
      - name: Restore authenticated unchanged v0.11 predecessor
        run: python3 -I -B scripts/materialize_v011_predecessor.py --destination target/v011-predecessor --reserve-bytes 4294967296

      - name: Validate final common proof authorization and affected lifecycle
        run: python3 -I -B scripts/check_v011_release_successor.py --require-authorized --predecessor-root target/v011-predecessor --artifact-manifest target/release/hegemon-release-artifacts.json --require-final-artifact

      - name: Release PQ binary audit
        run: ./scripts/security-audit.sh --require-binary --binary-manifest target/release/hegemon-release-artifacts.json --node-bin target/release/hegemon-node --binary target/release/wallet --binary target/release/walletd --binary target/release/private-spend

      - name: Package manifest-bound release assets
        run: python3 scripts/release_artifact_manifest.py package --manifest target/release/hegemon-release-artifacts.json --expect hegemon-node:hegemon-node:target/release/hegemon-node --expect wallet:wallet:target/release/wallet --expect walletd:walletd:target/release/walletd --expect wallet:private-spend:target/release/private-spend --asset hegemon-node:hegemon-node:hegemon-node-macos-arm64 --asset wallet:wallet:wallet-macos-arm64 --asset walletd:walletd:walletd-macos-arm64 --asset wallet:private-spend:private-spend-macos-arm64 --output-dir release --asset-manifest-name hegemon-release-assets-macos-arm64.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macos-arm-binary
          path: release/

  build-windows:
    runs-on: windows-latest
    needs:
      - security-gates
      - app-no-ssh-e2e
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Install LLVM
        run: choco install llvm -y

      - name: Install Protobuf
        run: choco install protoc -y

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: "1.91.1"
          components: rust-src

      - name: Verify Windows raw-byte launcher hashing
        shell: bash
        run: |
          python3 -B scripts/test_check_release_launcher_policy.py ReleaseLauncherPolicyTests.test_bounded_reader_preserves_crlf_and_ctrl_z_bytes ReleaseLauncherPolicyTests.test_crlf_helper_requires_its_raw_digest_not_normalized_lf

      - name: Build attested release artifacts
        shell: bash
        run: ./scripts/build_release_artifacts.sh

      - name: Verify release artifact manifest
        shell: bash
        run: python3 scripts/release_artifact_manifest.py verify --manifest target/release/hegemon-release-artifacts.json --expect hegemon-node:hegemon-node:target/release/hegemon-node.exe --expect wallet:wallet:target/release/wallet.exe --expect walletd:walletd:target/release/walletd.exe --expect wallet:private-spend:target/release/private-spend.exe
      - name: Restore authenticated unchanged v0.11 predecessor
        shell: bash
        run: python3 -I -B scripts/materialize_v011_predecessor.py --destination target/v011-predecessor --reserve-bytes 4294967296

      - name: Validate final common proof authorization and affected lifecycle
        shell: bash
        run: python3 -I -B scripts/check_v011_release_successor.py --require-authorized --predecessor-root target/v011-predecessor --artifact-manifest target/release/hegemon-release-artifacts.json --require-final-artifact

      - name: Release PQ binary audit
        shell: bash
        run: ./scripts/security-audit.sh --require-binary --binary-manifest target/release/hegemon-release-artifacts.json --node-bin target/release/hegemon-node.exe --binary target/release/wallet.exe --binary target/release/walletd.exe --binary target/release/private-spend.exe

      - name: Package manifest-bound release assets
        shell: bash
        run: python3 scripts/release_artifact_manifest.py package --manifest target/release/hegemon-release-artifacts.json --expect hegemon-node:hegemon-node:target/release/hegemon-node.exe --expect wallet:wallet:target/release/wallet.exe --expect walletd:walletd:target/release/walletd.exe --expect wallet:private-spend:target/release/private-spend.exe --asset hegemon-node:hegemon-node:hegemon-node-windows-x86_64.exe --asset wallet:wallet:wallet-windows-x86_64.exe --asset walletd:walletd:walletd-windows-x86_64.exe --asset wallet:private-spend:private-spend-windows-x86_64.exe --output-dir release --asset-manifest-name hegemon-release-assets-windows-x86_64.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-binary
          path: release/

  assemble-prepared-release:
    needs: [build-linux, build-macos-intel, build-macos-arm, build-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Download all prepared binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: artifacts
      - name: Verify and assemble manifest-bound release assets
        run: /usr/bin/python3 -I -B scripts/release_artifact_manifest.py assemble --bundle-manifest artifacts/linux-binary/hegemon-release-assets-linux-x86_64.json --bundle-manifest artifacts/macos-intel-binary/hegemon-release-assets-macos-x86_64.json --bundle-manifest artifacts/macos-arm-binary/hegemon-release-assets-macos-arm64.json --bundle-manifest artifacts/windows-binary/hegemon-release-assets-windows-x86_64.json --output-dir release-assets
      - name: Retain prepared files for operator review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: premainnet-release-assets
          path: release-assets/
          if-no-files-found: error
          retention-days: 14
