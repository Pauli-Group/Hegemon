[package]
name = "hegemon-binius-all-private-spike"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
binius-field = { path = "../crates/field" }
binius-hash = { path = "../crates/hash" }
binius-spartan-frontend = { path = "../crates/spartan-frontend" }
binius-spartan-prover = { path = "../crates/spartan-prover" }
binius-spartan-verifier = { path = "../crates/spartan-verifier" }
binius-transcript = { path = "../crates/transcript" }
rand = { version = "0.10.1", default-features = false, features = ["std", "std_rng"] }
serde_json = "1.0.140"
sha3 = "0.10.8"

[dev-dependencies]
hegemon-standalone-shake256-prototype = { path = "../hegemon-standalone-shake256-prototype" }

[profile.release]
lto = "thin"
debug = 0
incremental = false
