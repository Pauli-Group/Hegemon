[package]
name = "hegemon-m4-full-pay1x2-prototype"
version = "0.1.0"
edition = "2024"
publish = false

# This is an isolated research crate. It is not reachable from the production
# Hegemon workspace or consensus admission.
[workspace]
resolver = "2"

[dependencies]
binius-circuits = { git = "https://github.com/binius-zk/binius64.git", rev = "3f96163049f680b2909f6545690bd929f1b48c44" }
binius-core = { git = "https://github.com/binius-zk/binius64.git", rev = "3f96163049f680b2909f6545690bd929f1b48c44" }
binius-frontend = { git = "https://github.com/binius-zk/binius64.git", rev = "3f96163049f680b2909f6545690bd929f1b48c44" }
binius-hash = { git = "https://github.com/binius-zk/binius64.git", rev = "3f96163049f680b2909f6545690bd929f1b48c44" }
binius-m4-prover = { git = "https://github.com/binius-zk/binius64.git", rev = "3f96163049f680b2909f6545690bd929f1b48c44" }
binius-m4-verifier = { git = "https://github.com/binius-zk/binius64.git", rev = "3f96163049f680b2909f6545690bd929f1b48c44" }
binius-prover = { git = "https://github.com/binius-zk/binius64.git", rev = "3f96163049f680b2909f6545690bd929f1b48c44" }
binius-transcript = { git = "https://github.com/binius-zk/binius64.git", rev = "3f96163049f680b2909f6545690bd929f1b48c44" }
binius-verifier = { git = "https://github.com/binius-zk/binius64.git", rev = "3f96163049f680b2909f6545690bd929f1b48c44" }
hegemon-standalone-pay1x2-relation-prototype = { path = "../../../circuits/standalone-pay1x2-relation-prototype" }
hegemon-standalone-pay1x2-statement-prototype = { path = "../../../circuits/standalone-pay1x2-statement-prototype" }
hegemon-standalone-shake256-prototype = { path = "../../../circuits/standalone-shake256-prototype" }
serde_json = "1.0.140"
sha2 = "0.10.9"

[profile.dev]
opt-level = 1
debug = 0
incremental = false

[profile.test]
opt-level = 1
debug = 0
incremental = false

[profile.release]
lto = "thin"
debug = 0
incremental = false
