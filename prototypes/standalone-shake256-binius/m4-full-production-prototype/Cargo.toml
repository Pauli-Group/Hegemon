[package]
name = "hegemon-m4-full-production-prototype"
version = "0.0.0"
edition = "2024"
publish = false

# Isolated research crate: it is not a member of the production workspace and
# cannot be selected by consensus admission.
[workspace]
resolver = "2"

[features]
default = []
# Narrow bridge used only by the isolated repeated-ZK baseline executable. It
# exposes the already-built chip-free main constraint system and matching
# fixture witness, never a verifier capability or production admission route.
strict-baseline-material = []
# Explicit negative control only. The pinned upstream backend is transparent
# and targets 96 bits, so it cannot authorize the statement's pq128 profile.
prototype-weak = [
    "dep:binius-hash",
    "dep:binius-m4-prover",
    "dep:binius-m4-verifier",
    "dep:binius-prover",
    "dep:binius-transcript",
    "dep:binius-verifier",
]

[dependencies]
binius-circuits = { git = "https://github.com/binius-zk/binius64.git", rev = "3f96163049f680b2909f6545690bd929f1b48c44" }
binius-core = { git = "https://github.com/binius-zk/binius64.git", rev = "3f96163049f680b2909f6545690bd929f1b48c44" }
binius-frontend = { git = "https://github.com/binius-zk/binius64.git", rev = "3f96163049f680b2909f6545690bd929f1b48c44" }
binius-hash = { git = "https://github.com/binius-zk/binius64.git", rev = "3f96163049f680b2909f6545690bd929f1b48c44", optional = true }
binius-m4-prover = { git = "https://github.com/binius-zk/binius64.git", rev = "3f96163049f680b2909f6545690bd929f1b48c44", optional = true }
binius-m4-verifier = { git = "https://github.com/binius-zk/binius64.git", rev = "3f96163049f680b2909f6545690bd929f1b48c44", optional = true }
binius-prover = { git = "https://github.com/binius-zk/binius64.git", rev = "3f96163049f680b2909f6545690bd929f1b48c44", optional = true }
binius-transcript = { git = "https://github.com/binius-zk/binius64.git", rev = "3f96163049f680b2909f6545690bd929f1b48c44", optional = true }
binius-verifier = { git = "https://github.com/binius-zk/binius64.git", rev = "3f96163049f680b2909f6545690bd929f1b48c44", optional = true }
hegemon-standalone-full-shake256-relation-prototype = { path = "../../../circuits/standalone-full-shake256-relation-prototype" }

[[bin]]
name = "hegemon-m4-full-production-prototype"
path = "src/main.rs"

[profile.dev]
opt-level = 1
debug = 0
incremental = false

[profile.test]
opt-level = 1
debug = 0
incremental = false
